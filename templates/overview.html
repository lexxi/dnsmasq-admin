{% extends "base.html" %}
{% block content %}
<h2>Netz-Übersicht: {{ cidr }}</h2>
<p>Legende: <span class="chip" style="background:#eee">Hintergrund</span> = Segmentfarbe, <strong>×</strong> = Reservierung (fix), <strong>•</strong> = Lease, leer = frei</p>

<div class="grid" style="--cols: {{ cols }};">
  {% for c in cells %}
    <div class="cell" title="{{ c.ip }}{% if c.segment %} • {{ c.segment }}{% endif %}" style="background: {{ c.color }};">
      <span class="mark">
        {{ c.mark }}
      </span>
      <span class="ip">{{ c.ip.split('.')[-1] }}</span>
    </div>
  {% endfor %}
</div>
{% endblock %}
